[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesep"
version = "0.1.0"
description = "Reproducible bilingual multi-speaker separation research and a local audio workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.4,<3", "numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1",
  "scipy==1.13.1; sys_platform == 'darwin' and python_version < '3.13'",
  "rotary-embedding-torch==0.6.1", "packaging>=23", "PyYAML>=6,<7",
  "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "python-multipart>=0.0.18,<1",
  "pydantic>=2.6,<3", "typer>=0.12,<1", "httpx>=0.27,<1", "pystoi>=0.4,<1"
]

[project.optional-dependencies]
analysis = ["transformers>=4.44,<6", "huggingface-hub>=0.27,<2", "safetensors>=0.4,<1", "funasr==1.4.22", "torchaudio>=2.4,<3", "certifi>=2024.2"]
transcription = ["faster-whisper>=1.1,<2"]
baseline = ["asteroid>=0.7,<1"]
tracking = ["speechbrain>=1.0,<2", "torchaudio>=2.2,<3"]
data = ["datasets>=3,<5", "huggingface-hub>=0.27,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
voicesep = "voicesep.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
