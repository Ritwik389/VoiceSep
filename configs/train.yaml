seed: 42
model:
  sample_rate: 8000
  slots: 5
  n_fft: 128
  hop: 64
  layers: 6
  dimension: 128
  ffn_dimension: 384
  heads: 4
  gradient_checkpointing: true
  architecture: tflocoformer
data:
  manifest: data/train.jsonl
  validation: data/validation-mixtures.jsonl
  segment_seconds: 4
  language_conditions: [en, hi, mixed]
  max_speakers: 5
  partial_overlap_probability: 0.25
  noise_probability: 0.1
  reverb_probability: 0.1
training:
  steps: 20000
  warmup_steps: 500
  accumulation: 8
  backbone_lr: 0.0001
  head_lr: 0.0005
  weight_decay: 0.01
  clip_grad_norm: 5
  checkpoint_every: 500
  validate_every: 1000
  early_stopping_evaluations: 5
  amp: true
calibration:
  activity_threshold: 0.5
  min_active_fraction: 0.05
  min_energy_ratio: 0.001
  duplicate_threshold: 0.98
